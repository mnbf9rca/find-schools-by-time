<!doctype html>
<meta charset="utf-8">
<title>Schools by travel time</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  label { margin-right: 1rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 0.3rem 0.6rem; text-align: left; }
  th button { font: inherit; font-weight: bold; background: none; border: 0; padding: 0; cursor: pointer; }
  #error { color: #b00; }
</style>
<h1>Schools by travel time</h1>
<form id="search">
  <label>Postcode <input name="postcode" required></label>
  <label>Minutes <input name="minutes" type="number" min="1" max="240" value="60" required></label>
  <label>Mode
    <select name="mode">
      <option value="public_transport">Public transport</option>
      <option value="driving">Driving</option>
      <option value="cycling">Cycling</option>
      <option value="walking">Walking</option>
    </select>
  </label>
  <button id="go">Search</button>
</form>
<p id="error"></p>
<p><span id="count"></span> <button id="download" disabled>Download CSV</button></p>
<h2 id="results-heading" hidden>A level results, 2024/25</h2>
<table id="results"></table>
<p><small>Travel times by TravelTime</small></p>
<script type="module">
import { COLUMNS, comparator, csvRows, sort, toggle, reset } from './sort.js';
const form = document.getElementById('search');
const errorLine = document.getElementById('error');
const countLine = document.getElementById('count');
const table = document.getElementById('results');
const resultsHeading = document.getElementById('results-heading');
const download = document.getElementById('download');
let rows = [];
let filename = '';

function cell(row, text, tag = 'td') {
  const el = document.createElement(tag);
  el.textContent = text;
  row.appendChild(el);
  return el;
}

function render(focusIndex) {
  resultsHeading.hidden = false;
  table.textContent = '';
  const header = table.insertRow();
  for (const [index, column] of COLUMNS.entries()) {
    const th = cell(header, '', 'th');
    th.scope = 'col';
    const active = sort.column === index;
    th.setAttribute('aria-sort', active ? (sort.direction === 'asc' ? 'ascending' : 'descending') : 'none');
    const button = document.createElement('button');
    button.textContent = column.label + (active ? (sort.direction === 'asc' ? ' ▲' : ' ▼') : '');
    button.addEventListener('click', () => {
      toggle(index);
      render(index);
    });
    th.appendChild(button);
    if (index === focusIndex) button.focus();
  }
  for (const r of [...rows].sort(comparator(sort.key, sort.direction))) {
    const tr = table.insertRow();
    for (const column of COLUMNS) {
      const td = cell(tr, column.cell(r));
      if (column.link && r.website) {
        const a = document.createElement('a');
        a.href = r.website;
        a.textContent = 'Website';
        td.appendChild(a);
      }
    }
  }
}

download.addEventListener('click', () => {
  const lines = csvRows(rows);
  const url = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true;
  download.disabled = true;
  errorLine.textContent = '';
  countLine.textContent = '';
  table.textContent = '';
  resultsHeading.hidden = true;
  try {
    const data = new FormData(form);
    const geo = await fetch(
      'https://api.postcodes.io/postcodes/' + encodeURIComponent(data.get('postcode').trim()));
    const geoBody = geo.ok ? await geo.json() : null;
    const place = geoBody && geoBody.result;
    if (!place || place.latitude == null || place.longitude == null) {
      errorLine.textContent = 'Postcode not found or has no coordinates';
      return;
    }
    const search = await fetch('/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lat: place.latitude,
        lng: place.longitude,
        minutes: Number(data.get('minutes')),
        mode: data.get('mode'),
      }),
    });
    const found = await search.json();
    if (!search.ok) {
      errorLine.textContent = found.error || 'Search failed';
      return;
    }
    countLine.textContent = found.length + ' schools within ' + data.get('minutes') + ' minutes';
    rows = found;
    filename = `schools-${data.get('postcode').replaceAll(' ', '')}-${data.get('minutes')}min.csv`;
    reset();
    if (rows.length) render();
    download.disabled = !rows.length;
  } catch (e) {
    errorLine.textContent = String(e);
  } finally {
    go.disabled = false;
  }
});
</script>
